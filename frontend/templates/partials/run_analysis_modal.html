<style>
.course-location-modal {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}
.course-location-modal[hidden] { display: none !important; }
.course-location-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
}
.course-location-modal-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow: hidden;
    padding: 0;
}
.segment-recipes-modal-panel { max-width: min(720px, 96vw); }
.course-location-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    padding: 1.25rem 1.25rem 0.75rem;
}
.course-location-modal-header h4 { margin: 0; font-size: 1.15rem; color: #2c3e50; }
.course-location-modal-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0 1.25rem 1rem;
}
.course-location-modal-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    flex-shrink: 0;
    padding: 0.75rem 1.25rem 1.25rem;
    border-top: 1px solid #eee;
    background: #fff;
}
.course-location-modal-footer button {
    padding: 0.45rem 0.85rem;
    border: 1px solid #bdc3c7;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    font-size: 0.875rem;
}
.course-location-modal-footer button.primary {
    background: #3498db;
    color: #fff;
    border-color: #2980b9;
    font-weight: 600;
}
.course-derived-empty { color: #7f8c8d; font-size: 0.875rem; }
.course-derived-heading { font-size: 1.15rem; color: #2c3e50; }
.config-package-input {
    padding: 0.35rem 0.5rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 0.875rem;
}
</style>
<div id="run-analysis-modal" class="course-location-modal" hidden aria-hidden="true">
    <div class="course-location-modal-backdrop"></div>
    <div class="course-location-modal-panel segment-recipes-modal-panel" role="dialog" aria-labelledby="run-analysis-modal-title">
        <div class="course-location-modal-header">
            <h4 id="run-analysis-modal-title" class="course-derived-heading" style="margin: 0;">Run analysis</h4>
            <button type="button" id="run-analysis-modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="course-location-modal-body">
            <p class="course-derived-empty" style="margin: 0 0 0.75rem 0;">
                Enter a <strong>start time</strong> (HH:MM, 05:00–20:00) and <strong>duration</strong> (minutes) for each event.
                Analysis uses the race exports built for this package on <strong>Build → Packages</strong>.
            </p>
            <p id="run-analysis-package-label" class="course-derived-empty" style="margin: 0 0 0.5rem 0;"></p>
            <p id="run-analysis-event-day" class="course-derived-empty" style="margin: 0 0 0.75rem 0;"></p>
            <div class="scrollable-table-container course-derived-table-scroll course-derived-table-scroll--modal">
                <table class="table-sticky-header course-planner-table" style="width: 100%; font-size: 0.875rem;">
                    <thead>
                        <tr>
                            <th>Event</th>
                            <th>Start</th>
                            <th>Duration (min)</th>
                        </tr>
                    </thead>
                    <tbody id="run-analysis-events-tbody"></tbody>
                </table>
            </div>
            <p id="run-analysis-modal-error" class="course-derived-empty" style="display: none; color: #c0392b; margin: 0.75rem 0 0 0;"></p>
        </div>
        <div class="course-location-modal-footer">
            <button type="button" id="btn-run-analysis-submit" class="course-btn primary">Start analysis</button>
            <button type="button" id="run-analysis-modal-cancel" class="course-btn">Cancel</button>
        </div>
    </div>
</div>
<div id="package-picker-modal" class="course-location-modal" hidden aria-hidden="true">
    <div class="course-location-modal-backdrop"></div>
    <div class="course-location-modal-panel segment-recipes-modal-panel" role="dialog" aria-labelledby="package-picker-title">
        <div class="course-location-modal-header">
            <h4 id="package-picker-title" class="course-derived-heading" style="margin: 0;">New analysis</h4>
            <button type="button" id="package-picker-close" aria-label="Close">&times;</button>
        </div>
        <div class="course-location-modal-body">
            <p class="course-derived-empty" style="margin: 0 0 0.75rem 0;">
                Choose a package by <strong>name</strong> and <strong>ID</strong>, then set start times.
            </p>
            <label for="package-picker-select" class="course-derived-empty" style="display: block; margin-bottom: 0.35rem;">Package</label>
            <select id="package-picker-select" class="form-select" style="width: 100%;">
                <option value="">Loading packages…</option>
            </select>
            <p id="package-picker-id" class="course-derived-empty" style="margin: 0.5rem 0 0 0;"></p>
            <p id="package-picker-error" class="course-derived-empty" style="display: none; color: #c0392b; margin: 0.75rem 0 0 0;"></p>
        </div>
        <div class="course-location-modal-footer">
            <button type="button" id="package-picker-continue" class="course-btn primary" disabled>Continue</button>
            <button type="button" id="package-picker-cancel" class="course-btn">Cancel</button>
        </div>
    </div>
</div>
