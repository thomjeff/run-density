services:
  create:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runflow-create
    ports:
      - "8080:8080"
    volumes:
      # Bind mount source code for hot reload during development
      - ./app:/app/app
      # Bind mount tests directory
      - ./tests:/app/tests
      # Combined-image contract files (Epic #916 release preservation)
      - ./Dockerfile:/app/Dockerfile:ro
      - ./Dockerfile.cloud:/app/Dockerfile.cloud:ro
      - ./Dockerfile.execute:/app/Dockerfile.execute:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      # Race Roster → runner CSV conversion CLI
      - ./scripts:/app/scripts
      # Bind mount templates for UI pages
      - ./frontend/templates:/app/frontend/templates
      # Bind mount static files for hot reload
      - ./frontend/static:/app/frontend/static
      # Bind mount data and config directories
      - ./data:/app/data
      - ./config:/app/config
      # Issue #694: Mount docs directory for AI analysis templates
      - ./docs:/app/docs
      # Reference leg GPX library for recipe UI bootstrap
      - ./cursor:/app/cursor
      # Issue #470: Legacy artifacts/ and reports/ mounts removed - using runflow/ structure exclusively
      # Issue #465: GCS keys mount disabled during Phase 0 (local-only mode)
      # - ./keys:/tmp/keys:ro
      # Issue #455 / #798 Phase 4: Mount Runflow data root (set RUNFLOW_ROOT in .env)
      - ${RUNFLOW_ROOT:-./runflow}:/app/runflow
    # Phase 2: Use env_file instead of mounting .env
    # Environment variables from dev.env are injected into container
    env_file:
      - dev.env
    environment:
      # Container-specific environment variables (not in dev.env)
      - PORT=8080
      - PYTHONPATH=/app
      - MPLBACKEND=Agg
      # Issue #798 Phase 4: host prefix for path rewrite inside the container
      - RUNFLOW_ROOT_HOST=${RUNFLOW_ROOT:-./runflow}
      - RUNFLOW_ROOT_CONTAINER=/app/runflow
      # Issue #465: GCS environment overrides disabled during Phase 0 (local-only mode)
      # - GCS_UPLOAD=${GCS_UPLOAD}
      # - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      # - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    stdin_open: true
    tty: true
    # Issue #503: Memory and CPU limits for performance optimization
    # NOTE: deploy.* is ignored by Compose (non-swarm).
    # Use mem_limit/cpus to enforce local limits with `make create`.
    mem_limit: 10g
    mem_reservation: 8g
    cpus: "3.0"
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '3.0'
        reservations:
          memory: 8G
          cpus: '2.0'

  execute-db:
    image: postgres:15
    container_name: runflow-execute-db
    environment:
      POSTGRES_DB: execute
      POSTGRES_USER: execute
      POSTGRES_PASSWORD: execute
    ports:
      - "5433:5432"
    volumes:
      - execute-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U execute -d execute"]
      interval: 2s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: "1.0"

  execute:
    build:
      context: .
      dockerfile: Dockerfile.execute
    container_name: runflow-execute
    ports:
      - "8081:8080"
    env_file:
      - dev.env
    environment:
      - PORT=8080
      - PYTHONPATH=/app
      - RUNFLOW_EXECUTE_RUNTIME=1
      - EXECUTE_DATABASE_URL=postgresql://execute:execute@execute-db:5432/execute
      - EXECUTE_GPS_TOKEN=${EXECUTE_GPS_TOKEN:-}
      - RUNFLOW_ROOT=/app/runflow
    volumes:
      - execute-runtime-data:/app/runflow
    depends_on:
      execute-db:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"

volumes:
  execute-db-data:
  execute-runtime-data:
